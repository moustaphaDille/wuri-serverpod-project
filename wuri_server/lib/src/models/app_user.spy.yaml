class: AppUser
table: app_user
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  firstName: String
  lastName: String
  phone: String
  role: UserRole
  language: String
  createdAt: DateTime
indexes:
  app_user_auth_user_idx:
    fields: authUserId
    unique: true