services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wuri
      POSTGRES_PASSWORD: "K6cArjouV3cqJmau8me_unDJGeVfD77u"
    volumes:
      - wuri_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Ue8-GPWJLSLzLU5bM7h9CpZhXjZmWU9o"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wuri_test
      POSTGRES_PASSWORD: "8ssoJQg31KVkC5sEU0XZM9pnNVESyfeH"
    volumes:
      - wuri_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "3fz5IMWHKbN1ry58xt1UWqQ2T8XNJqC5"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  wuri_data:
  wuri_test_data:
